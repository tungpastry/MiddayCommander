version: 2

project_name: MiddayCommander

before:
  hooks:
    - go mod vendor

builds:
  - id: mdc
    binary: mdc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - ids:
      - mdc
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz
  prefix_template: "{{ .ProjectName }}-{{ .Version }}/"
  files:
    - vendor/modules.txt
    - vendor/**/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

nfpms:
  - package_name: mdc
    ids:
      - mdc
    vendor: tungpastry
    homepage: https://github.com/tungpastry/MiddayCommander
    maintainer: Tung Nguyen Thanh <tungpastry@users.noreply.github.com>
    description: "A modern dual-panel terminal file manager"
    license: MIT
    formats:
      - deb
      - rpm

release:
  github:
    owner: tungpastry
    name: MiddayCommander
  make_latest: true
  mode: replace
